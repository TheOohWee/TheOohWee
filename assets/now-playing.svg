<svg width="400" height="110" viewBox="0 0 400 110" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="110" rx="16" fill="#121212" stroke="#1ED760" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Spotify logo icon -->
  <circle cx="40" cy="55" r="22" fill="#1ED760"/>
  <path d="M28 48c8-3 18-3 26 1" stroke="#121212" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M27 55c7-2.5 16-2.5 23 1" stroke="#121212" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M27 62c6-2 13-2 19 1" stroke="#121212" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Track info -->
  <text x="78" y="46" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">Trojan Horse</text>
  <text x="78" y="66" fill="#b3b3b3" font-family="Helvetica, Arial, sans-serif" font-size="12">Dave, Central Cee</text>

  <!-- Equalizer bars -->
  <g fill="#1ED760">
    <rect x="330" y="40" width="4" height="20">
      <animate attributeName="height" values="20;35;10;28;20" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="40;25;50;32;40" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="340" y="30" width="4" height="30">
      <animate attributeName="height" values="30;15;35;20;30" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;45;25;40;30" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="350" y="20" width="4" height="40">
      <animate attributeName="height" values="40;22;38;15;40" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;38;22;45;20" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="360" y="35" width="4" height="25">
      <animate attributeName="height" values="25;38;12;30;25" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="35;22;48;30;35" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
