name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"  # runs every 6 hours
  workflow_dispatch: {}     # lets you trigger it manually too
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00F0FF&color_dots=161B22,0D2B3E,155E8A,1E90FF,00F0FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=00F0FF&color_dots=161B22,0D2B3E,155E8A,1E90FF,00F0FF&color_dark=000000

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
